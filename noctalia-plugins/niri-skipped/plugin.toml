id = "namitjuneja/niri-skipped"
name = "Niri Skipped Windows"
version = "1.0.0"
plugin_api = 24
author = "namitjuneja"
license = "MIT"
icon = "eye-off"
description = "Bar counter for windows skipped in the niri Mod+Tab cycle (Mod+Shift+N)."
tags = ["bar", "indicator", "niri"]
dependencies = ["niri", "jq", "sh"]

[[widget]]
id = "skipped"
entry = "widget.luau"

    [[widget.setting]]
    key = "glyph"
    type = "glyph"
    label_key = "settings.glyph.label"
    description_key = "settings.glyph.description"
    default = "eye-off"

    [[widget.setting]]
    key = "color"
    type = "color"
    label_key = "settings.color.label"
    description_key = "settings.color.description"
    default = "on_surface_variant"

    [[widget.setting]]
    key = "hide_when_zero"
    type = "bool"
    label_key = "settings.hide_when_zero.label"
    description_key = "settings.hide_when_zero.description"
    default = true
