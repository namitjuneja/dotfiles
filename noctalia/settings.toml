config_version = 15

[accessibility]
ui_scale = 0.85000000521540642

[audio]
enable_screenshot_sounds = false
enable_sounds = false

[bar]
order = [ "default", "peek" ]

    [bar.default]
    center = [ "niri-taskbar" ]
    color = "primary"
    end = [
        "ambient-sounds",
        "todo",
        "notes",
        "status",
        "media-player-icon",
        "bluetooth",
        "media",
        "tray",
        "volume",
        "notifications",
        "clipboard",
        "network",
        "bluetooth",
        "brightness",
        "battery",
        "control-center",
        "session",
        "weather",
        "bar",
        "clock"
    ]
    font_scale = 0.69999999180436134
    margin_ends = 0
    position = "bottom"
    shadow = false
    start = [ "workspaces" ]
    widget_spacing = 10

        [bar.default.dead_zone.actions]
        left = "panel-toggle control-center home"
        right = "settings-toggle"

    [bar.peek]
    capsule = true
    capsule_border = "secondary"
    capsule_fill = "surface"
    capsule_opacity = 0.99999997764825821
    capsule_radius = 3
    center = []
    color = "secondary"
    compositor_blur = false
    end = [ "peek-media" ]
    hover_highlight = false
    icon_color = "secondary"
    margin_edge = 6
    margin_ends = 0
    padding = 13
    shadow = false
    show_tooltip = false
    start = [ "bar_2" ]
    widget_spacing = 15

[brightness]
enable_ddcutil = true

[calendar]
enabled = true

    [calendar.account.personal_google]
    name = "Namit"
    type = "google"

[control_center]
sidebar = "full"

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
background_opacity = 0.99999997764825821

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]
pre_action_fade_seconds = 30

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 300.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 3600.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 420.0

[location]
auto_locate = true

[lockscreen]
transition = [ "fade" ]
transition_duration = 300

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-4", "lockscreen-widget-0000000000000001" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-4"]
    box_height = 196.0
    box_width = 810.0
    cx = 1075.0
    cy = 718.0
    output = "DP-4"
    placement_height = 900.0
    placement_width = 2150.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-4".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 0.0
    box_width = 0.0
    cx = 1075.0
    cy = 450.0
    output = "DP-4"
    placement_height = 900.0
    placement_width = 2150.0
    rotation = 0.0
    type = "clock"

[nightlight]
