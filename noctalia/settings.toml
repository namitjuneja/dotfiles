config_version = 14

[accessibility]
ui_scale = 0.85000000521540642

[bar]
order = [ "default" ]

    [bar.default]
    capsule_radius = 3
    center = [ "taskbar" ]
    color = "primary"
    end = [
        "todo",
        "notes",
        "media-player-icon",
        "media",
        "tray",
        "volume",
        "notifications",
        "clipboard",
        "network",
        "bluetooth",
        "brightness",
        "battery",
        "control-center",
        "session",
        "weather",
        "bar",
        "clock"
    ]
    font_family = "Adwaita Mono"
    font_scale = 0.69999999180436134
    margin_ends = 0
    position = "bottom"
    start = [ "launcher", "workspaces" ]
    widget_spacing = 10

[brightness]
enable_ddcutil = true

[calendar]
enabled = true

    [calendar.account.personal_google]
    name = "Namit"
    type = "google"

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]
pre_action_fade_seconds = 30

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 300.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 420.0

[location]
auto_locate = true

[lockscreen]
transition = [ "fade" ]
transition_duration = 300

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-4", "lockscreen-widget-0000000000000001" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-4"]
    box_height = 196.0
    box_width = 810.0
    cx = 1075.0
    cy = 718.0
    output = "DP-4"
    placement_height = 900.0
    placement_width = 2150.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-4".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 0.0
    box_width = 0.0
    cx = 1075.0
    cy = 450.0
    output = "DP-4"
    placement_height = 900.0
    placement_width = 2150.0
    rotation = 0.0
    type = "clock"

[panels]
transparency_mode = "glass"

[plugin_settings."davemhammer/obsidian"]
vault_path = "/home/namit/Documents/Phosphorus"

[plugin_settings."gcap0n1/f1"]
default_tab = "drivers"
favorite_driver = "ANT"
live_source = "f1_feed"
notify_race = true
panel_open_near_click = false
panel_placement = "floating"
panel_position = "center"

[plugin_settings."nightwatch75/todo"]
panel_open_near_click = false
panel_position = "center"
sound_on_complete = true

[plugin_settings."noctalia/notes"]
panel_open_near_click = false

[plugin_settings."noctalia/world_clock"]
panel_open_near_click = false
show_add_zone = false
time_format = "12h"

[plugins]
enabled = [
    "noctalia/notes",
    "noctalia/world_clock",
    "nightwatch75/todo",
    "davemhammer/obsidian",
    "ismay/media-player-icon",
    "lowcache/claude-companion",
    "lfdominguez/claude-sessions",
    "pulser/hover-widgets",
    "icefish/phone-operate",
    "thepunkoff/pomodoro",
    "notfinaldev/youtube-search",
    "namitjuneja/niri-skipped"
]

    [[plugins.source]]
    kind = "path"
    location = "/home/namit/.config/noctalia-plugins"
    name = "local"

[shell]
password_style = "random"

    [shell.launcher]
    categories = false
    compact = true

    [shell.panel]
    session_placement = "floating"
    session_position = "center"

[theme]
builtin = "Ayu"
community_palette = "Jiva Paper"
mode = "dark"
pure_black_dark = true
shell_mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

[wallpaper]
directory = "/home/namit/Downloads"
fill_mode = "crop"

    [wallpaper.default]
    path = "/home/namit/Downloads/lukasz-szmigiel-8AdYB7M4OHY-unsplash.jpg"

    [wallpaper.last]
    path = "/home/namit/Downloads/lukasz-szmigiel-8AdYB7M4OHY-unsplash.jpg"

    [wallpaper.monitors.DP-4]
    path = "/home/namit/Downloads/lukasz-szmigiel-8AdYB7M4OHY-unsplash.jpg"

[widget.bar]
type = "noctalia/world_clock:bar"

[widget.brightness]
show_label = false

[widget.clock]
font_weight = 700
format = "{:%a %d %b %I:%M%P}"

[widget.media]
enabled = false
hide_album_art = true
hide_artist = true
hide_when_no_media = true
max_length = 81
rotate_album_art = true

[widget.media-player-icon]
hide_stopped = true
paused_color = "primary"
playing_glyph = "music"
type = "ismay/media-player-icon:media-player-icon"

[widget.niri-skipped]
type = "namitjuneja/niri-skipped:skipped"

[widget.network]
show_label = false

[widget.notes]
type = "noctalia/notes:notes"

[widget.taskbar]
capsule = false
icon_scale = 1.4000000000000001
inactive_opacity = 0.5
only_active_workspace = true
show_window_title = true
show_workspace_label = false
window_title_max_width = 150
workspace_group_capsule = false

[widget.todo]
type = "nightwatch75/todo:todo"

[widget.weather]
show_condition = false

[widget.workspaces]
active_pill_size = 1.0
empty_color = "on_primary"
font_family = "Adwaita Mono"
font_weight = 700
occupied_color = "surface_variant"
scale = 1.2000000000000002