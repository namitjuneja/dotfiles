[plugins]
enabled = [
    "noctalia/notes",
    "noctalia/world_clock",
    "nightwatch75/todo",
    "davemhammer/obsidian",
    "ismay/media-player-icon",
    "lowcache/claude-companion",
    "lfdominguez/claude-sessions",
    "pulser/hover-widgets",
    "icefish/phone-operate",
    "thepunkoff/pomodoro",
    "notfinaldev/youtube-search",
    "reaperhound/ambient-sounds",
    "namitjuneja/niri-taskbar"
]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

    [[plugins.source]]
    kind = "path"
    location = "/home/namit/.config/noctalia-plugins"
    name = "local"

