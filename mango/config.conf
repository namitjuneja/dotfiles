# Mango config. Keybinds mirror the niri config (Mod = Super).
# Unmappable niri actions (tabbed columns, move-workspace, hotkey overlay, ...) are omitted.

# --- Input ---
# Alt/Super swapped, Caps Lock acts as Escape (same as niri/hyprland)
xkb_rules_layout=us
xkb_rules_options=altwin:swap_alt_win,caps:escape
numlock_on=1
repeat_rate=25
repeat_delay=600
tap_to_click=1
trackpad_natural_scrolling=1

# --- Output ---
monitor_rule=name:DP-4,width:3440,height:1440,refresh:60,x:0,y:0,scale:1.6
monitor_rule=name:HDMI-A-2,width:3440,height:1440,refresh:60,x:0,y:0,scale:1.6

# --- Layout ---
tag_num=9
tag_animation_direction=0
gap_inner_horizontal=5
gap_inner_vertical=5
gap_outer_horizontal=5
gap_outer_vertical=5
border_px=2
scroller_default_proportion=0.5
scroller_proportion_preset=0.33333,0.5,0.66667
tag_rule=id:1,layout_name:tile
tag_rule=id:2,layout_name:tile
tag_rule=id:3,layout_name:tile
tag_rule=id:4,layout_name:tile
tag_rule=id:5,layout_name:tile
tag_rule=id:6,layout_name:tile
tag_rule=id:7,layout_name:tile
tag_rule=id:8,layout_name:tile
tag_rule=id:9,layout_name:tile

# --- Animations: disabled ---
animations=0
layer_animations=0
animation_duration_tag=1
animation_duration_open=50
animation_duration_close=50
animation_duration_move=50
animation_duration_focus=0

# --- Blur (windows and noctalia bar/panels) ---
blur=1
blur_layer=1
blur_optimized=1

# --- Monocle/deck: no tab bar, no gaps or borders in monocle ---
monocle_tab_mode=0
deck_tab_mode=0
monocle_no_gap=1
monocle_no_border=1

# Floating terminal (Mod+Shift+Return launches kitty with this class)
window_rule=is_floating:1,app_id:floating-term,width:800,height:500

# --- Autostart: noctalia shell ---
exec_once=~/.config/mango/float-hide.sh
exec_once=noctalia
# Peek bar starts visible; keep re-hiding it until noctalia's IPC is up.
exec_once=bash -c 'for i in $(seq 50); do sleep 0.5; noctalia msg bar-hide peek >/dev/null 2>&1 && break; done; for i in $(seq 20); do sleep 1; noctalia msg bar-hide peek >/dev/null 2>&1; done'

# --- Key Bindings ---
# Apps
bind=SUPER+SHIFT,Return,spawn_shell,kitty --class floating-term
bind=SUPER,d,spawn_shell,fuzzel
bind=SUPER,space,spawn_shell,noctalia msg panel-toggle launcher
bind=SUPER,Return,spawn_shell,kitty
bind=SUPER,F1,spawn_shell,firefox
# `view,N,0` contains commas, which would be split as bind arguments, so build it via $c
bind=SUPER,F3,spawn_shell,c=,; mmsg dispatch view${c}3${c}0; code
bind=SUPER,F4,spawn_shell,c=,; mmsg dispatch view${c}4${c}0; kitty
bind=SUPER,F5,spawn_shell,c=,; mmsg dispatch view${c}5${c}0; nautilus
bind=SUPER,F6,spawn_shell,c=,; mmsg dispatch view${c}6${c}0; OBSIDIAN_USE_WAYLAND=1 obsidian -enable-features=UseOzonePlatform -ozone-platform=wayland
bind=SUPER,F7,spawn_shell,c=,; mmsg dispatch view${c}7${c}0; google-chrome-stable
bind=SUPER,F9,spawn_shell,c=,; mmsg dispatch view${c}9${c}0; firefox --new-window music.youtube.com

# Workspaces (tags): F1-F9 view, Shift+F1-F9 / Mod+Shift+N send without following
bind=NONE,F1,view,1,0
bind=NONE,F2,view,2,0
bind=NONE,F3,view,3,0
bind=NONE,F4,view,4,0
bind=NONE,F5,view,5,0
bind=NONE,F6,view,6,0
bind=NONE,F7,view,7,0
bind=NONE,F8,view,8,0
bind=NONE,F9,view,9,0
bind=SHIFT,F1,tagsilent,1,0
bind=SHIFT,F2,tagsilent,2,0
bind=SHIFT,F3,tagsilent,3,0
bind=SHIFT,F4,tagsilent,4,0
bind=SHIFT,F5,tagsilent,5,0
bind=SHIFT,F6,tagsilent,6,0
bind=SHIFT,F7,tagsilent,7,0
bind=SHIFT,F8,tagsilent,8,0
bind=SHIFT,F9,tagsilent,9,0
bind=SUPER+SHIFT,1,tagsilent,1,0
bind=SUPER+SHIFT,F1,tagsilent,1,0
bind=SUPER+SHIFT,2,tagsilent,2,0
bind=SUPER+SHIFT,F2,tagsilent,2,0
bind=SUPER+SHIFT,3,tagsilent,3,0
bind=SUPER+SHIFT,F3,tagsilent,3,0
bind=SUPER+SHIFT,4,tagsilent,4,0
bind=SUPER+SHIFT,F4,tagsilent,4,0
bind=SUPER+SHIFT,5,tagsilent,5,0
bind=SUPER+SHIFT,F5,tagsilent,5,0
bind=SUPER+SHIFT,6,tagsilent,6,0
bind=SUPER+SHIFT,F6,tagsilent,6,0
bind=SUPER+SHIFT,7,tagsilent,7,0
bind=SUPER+SHIFT,F7,tagsilent,7,0
bind=SUPER+SHIFT,8,tagsilent,8,0
bind=SUPER+SHIFT,F8,tagsilent,8,0
bind=SUPER+SHIFT,9,tagsilent,9,0
bind=SUPER+SHIFT,F9,tagsilent,9,0
bind=SUPER+CTRL,1,tag,1,0
bind=SUPER+CTRL,2,tag,2,0
bind=SUPER+CTRL,3,tag,3,0
bind=SUPER+CTRL,4,tag,4,0
bind=SUPER+CTRL,5,tag,5,0
bind=SUPER+CTRL,6,tag,6,0
bind=SUPER+CTRL,7,tag,7,0
bind=SUPER+CTRL,8,tag,8,0
bind=SUPER+CTRL,9,tag,9,0
bind=SUPER,Page_Down,viewtoright,0
bind=SUPER,Page_Up,viewtoleft,0
bind=SUPER,u,viewtoright,0
bind=SUPER,i,viewtoleft,0
bind=SUPER+CTRL,Page_Down,tagtoright,0
bind=SUPER+CTRL,Page_Up,tagtoleft,0
bind=SUPER+CTRL,u,tagtoright,0
bind=SUPER+CTRL,i,tagtoleft,0

# Volume / brightness / media (work while locked)
bindl=SUPER,equal,spawn_shell,wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindl=SUPER,minus,spawn_shell,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl=SUPER,0,spawn_shell,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl=SUPER+SHIFT,equal,spawn_shell,noctalia msg brightness-up
bindl=SUPER+SHIFT,minus,spawn_shell,noctalia msg brightness-down
bindl=SUPER,slash,spawn_shell,playerctl play-pause
bindl=SUPER,semicolon,spawn_shell,playerctl previous; sleep 0.5; noctalia msg bar-show peek; sleep 2.5; noctalia msg bar-hide peek
bindl=SUPER,apostrophe,spawn_shell,playerctl next; sleep 0.5; noctalia msg bar-show peek; sleep 2.5; noctalia msg bar-hide peek
bindl=NONE,XF86AudioRaiseVolume,spawn_shell,wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.1+ -l 1.0
bindl=NONE,XF86AudioLowerVolume,spawn_shell,wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.1-
bindl=NONE,XF86AudioMute,spawn_shell,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl=NONE,XF86AudioMicMute,spawn_shell,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl=NONE,XF86AudioPlay,spawn_shell,playerctl play-pause
bindl=NONE,XF86AudioStop,spawn_shell,playerctl stop
bindl=NONE,XF86AudioPrev,spawn_shell,playerctl previous; sleep 0.5; noctalia msg bar-show peek; sleep 2.5; noctalia msg bar-hide peek
bindl=NONE,XF86AudioNext,spawn_shell,playerctl next; sleep 0.5; noctalia msg bar-show peek; sleep 2.5; noctalia msg bar-hide peek
bindl=NONE,XF86MonBrightnessUp,spawn_shell,brightnessctl --class=backlight set +10%
bindl=NONE,XF86MonBrightnessDown,spawn_shell,brightnessctl --class=backlight set 10%-

# Noctalia panels / session
bind=SUPER,b,spawn_shell,noctalia msg panel-toggle clipboard
bind=SUPER,t,spawn_shell,noctalia msg panel-toggle nightwatch75/todo:panel
bind=SUPER,p,spawn_shell,noctalia msg bar-show peek; sleep 2.5; noctalia msg bar-hide peek
bind=NONE,F19,spawn_shell,noctalia msg bar-show peek; sleep 2.5; noctalia msg bar-hide peek
bind=SUPER+SHIFT,space,spawn_shell,noctalia msg session lock
bind=SUPER+SHIFT,Delete,spawn_shell,systemctl poweroff
bind=SUPER+SHIFT+CTRL,Delete,spawn_shell,systemctl reboot
bind=SUPER+ALT,l,spawn_shell,swaylock
bindl=SUPER+ALT,s,spawn_shell,pkill orca || exec orca

# Window
bind=SUPER,q,killclient,
bind=SUPER,BackSpace,killclient,
bind=SUPER,o,toggleoverview,
bind=SUPER,f,togglefloating,
bind=SUPER,v,togglefloating,
# Toggle monocle (back to tile); commas in dispatch args built via $c
bind=SUPER,m,spawn_shell,c=,; if mmsg get all-monitors | grep -q layout_symbol.:.M.; then mmsg dispatch setlayout${c}tile; else mmsg dispatch setlayout${c}monocle; fi
bind=SUPER+SHIFT,m,togglefullscreen,
bind=SUPER,r,switch_layout
# No native previous-layout action: step back through `mmsg get layouts`
bind=SUPER+SHIFT,r,spawn_shell,c=,; i=$(mmsg get all-monitors | jq .monitors[0].layout_index); n=$(mmsg get layouts | jq -r --argjson i $i '.layouts|.[($i+length-1)%length].name'); mmsg dispatch setlayout${c}$n
bind=SUPER+CTRL,f,set_proportion,1.0
bind=SUPER,c,centerwin,
bind=SUPER,s,toggle_scratchpad
bind=SUPER,n,spawn_shell,~/.config/mango/minimize.sh min
bind=SUPER+SHIFT,n,spawn_shell,~/.config/mango/minimize.sh restore
bind=SUPER,bracketleft,scroller_stack,left
bind=SUPER,bracketright,scroller_stack,right

# Focus
bind=SUPER,Left,focusdir,left
bind=SUPER,Down,focusdir,down
bind=SUPER,Up,focusdir,up
bind=SUPER,Right,focusdir,right
bind=SUPER,h,focusdir,left
bind=SUPER,j,focusdir,down
bind=SUPER,k,focusdir,up
bind=SUPER,l,focusdir,right
bind=ALT,Tab,focusstack,next
bind=ALT+SHIFT,Tab,focusstack,prev
bind=SUPER,Tab,focusstack,next
bind=SUPER+SHIFT,Tab,focusstack,prev

# Move
bind=SUPER+CTRL,Left,exchange_client,left
bind=SUPER+CTRL,Down,exchange_client,down
bind=SUPER+CTRL,Up,exchange_client,up
bind=SUPER+CTRL,Right,exchange_client,right
bind=SUPER+CTRL,h,exchange_client,left
bind=SUPER+CTRL,j,exchange_client,down
bind=SUPER+CTRL,k,exchange_client,up
bind=SUPER+CTRL,l,exchange_client,right

# Resize
bind=SUPER+SHIFT,h,setmfact,-0.05
bind=SUPER+SHIFT,l,setmfact,+0.05
bind=SUPER+SHIFT,k,resizewin,+0,-50
bind=SUPER+SHIFT,j,resizewin,+0,+50

# Monitors
bind=SUPER+SHIFT,Left,focusmon,left
bind=SUPER+SHIFT,Down,focusmon,down
bind=SUPER+SHIFT,Up,focusmon,up
bind=SUPER+SHIFT,Right,focusmon,right
bind=SUPER+SHIFT+CTRL,Left,tagmon,left
bind=SUPER+SHIFT+CTRL,Down,tagmon,down
bind=SUPER+SHIFT+CTRL,Up,tagmon,up
bind=SUPER+SHIFT+CTRL,Right,tagmon,right
bind=SUPER+SHIFT+CTRL,h,tagmon,left
bind=SUPER+SHIFT+CTRL,j,tagmon,down
bind=SUPER+SHIFT+CTRL,k,tagmon,up
bind=SUPER+SHIFT+CTRL,l,tagmon,right

# Screenshots (noctalia)
bind=NONE,Print,spawn_shell,noctalia msg screenshot-region
bind=CTRL,Print,spawn_shell,noctalia msg screenshot-fullscreen
bind=SHIFT,Print,spawn_shell,noctalia msg screenshot-annotate
bind=SUPER+SHIFT,Print,spawn_shell,noctalia msg screenshot-region

# Session
bind=SUPER+SHIFT,e,quit
bind=CTRL+ALT,Delete,quit

# Mouse
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client
axisbind=SUPER+CTRL,UP,tagtoleft
axisbind=SUPER+CTRL,DOWN,tagtoright
axisbind=SUPER+SHIFT,UP,focusdir,left
axisbind=SUPER+SHIFT,DOWN,focusdir,right
