#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hypr.land/Configuring/Variables/

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in = 5
    gaps_out = 5

    border_size = 3

    # https://wiki.hypr.land/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(59595966)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = master
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    dim_special = 0.8
    dim_inactive = true
    dim_strength = 0.2

    rounding = 0
    rounding_power = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = false
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hypr.land/Configuring/Variables/#blur
    blur {
        enabled = false
        size = 12
        passes = 4
        new_optimizations = true
        xray = false

        vibrancy = 0.8
        vibrancy_darkness = 0.5
        brightness = 1.1
        contrast = 0.9
        noise = 0.02
        popups = true
    }
}

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = no, please :)

    # Default curves, see https://wiki.hypr.land/Configuring/Animations/#curves
    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    # Default animations, see https://wiki.hypr.land/Configuring/Animations/
    #           NAME,          ONOFF, SPEED, CURVE,        [STYLE]
    animation = global,        1,     10,    default
    animation = border,        1,     1,     easeOutQuint
    animation = windows,       1,     1,     easeOutQuint
    animation = windowsIn,     1,     1,     easeOutQuint, popin 87%
    animation = windowsOut,    1,     0.5,   linear,       popin 87%
    animation = fadeIn,        1,     0.5,   almostLinear
    animation = fadeOut,       1,     0.5,   almostLinear
    animation = fade,          1,     0.5,   quick
    animation = layers,        1,     1,     easeOutQuint
    animation = layersIn,      1,     1,     easeOutQuint, fade
    animation = layersOut,     1,     0.5,   linear,       fade
    animation = fadeLayersIn,  1,     0.5,   almostLinear
    animation = fadeLayersOut, 1,     0.5,   almostLinear
    animation = workspaces,    0,     1.94,  almostLinear, slide
    animation = workspacesIn,  0,     1.21,  almostLinear, slide
    animation = workspacesOut, 0,     1.94,  almostLinear, slide
    animation = zoomFactor,    1,     1.5,   quick
}

# Ref https://wiki.hypr.land/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
workspace = 1, name:1: Firefox, persistent:true
workspace = 2, name:2: Firefox, persistent:true
workspace = 3, name:3: Code, persistent:true
workspace = 4, name:4: Term, persistent:true
workspace = 5, name:5: Browser, persistent:true
workspace = 6, name:6: Notes, persistent:true
workspace = 7, name:7: Chrome, persistent:true
workspace = 8, name:8: Bay, persistent:true
workspace = 9, name:9: Music, persistent:true
workspace = w[tv1], gapsout:0, gapsin:0
workspace = f[1], gapsout:0, gapsin:0
windowrule {
    name = no-gaps-wtv1
    match:float = false
    match:workspace = w[tv1]

    border_size = 0
    rounding = 0
}

windowrule {
    name = no-gaps-f1
    match:float = false
    match:workspace = f[1]

    border_size = 0
    rounding = 0
}

# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = slave
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    vfr = true
}


#############
### INPUT ###
#############

# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options = altwin:swap_alt_win,caps:escape
    kb_rules =

    follow_mouse = 1

    sensitivity = 1 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}

cursor {
    no_hardware_cursors = true
}

# See https://wiki.hypr.land/Configuring/Gestures
gesture = 3, horizontal, workspace

# Example per-device config
# See https://wiki.hypr.land/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = $mainMod, return, exec, $terminal
bind = $mainMod SHIFT, return, exec, [float; size 800 500] $terminal
bind = $mainMod, backspace, killactive,
bind = $mainMod SHIFT, delete, exec, systemctl poweroff
bind = $mainMod SHIFT CTRL, delete, exec, systemctl reboot
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, F, togglefloating,
bind = $mainMod, M, fullscreen, 1
bind = $mainMod, space, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, backslash, layoutmsg, swapwithmaster
bind = $mainMod, bracketright, layoutmsg, addmaster
bind = $mainMod, bracketleft, layoutmsg, removemaster
bind = $mainMod, R, layoutmsg, orientationnext

# Clipboard manager
bind = $mainMod, B, exec, cliphist list | rofi -dmenu -display-columns 2 | cliphist decode | wl-copy

# App shortcuts
bind = $mainMod, F1, exec, firefox
bind = $mainMod, F3, exec, code
bind = $mainMod, F4, exec, $terminal
bind = $mainMod, F5, exec, $fileManager
bind = $mainMod, F6, exec, OBSIDIAN_USE_WAYLAND=1 obsidian -enable-features=UseOzonePlatform -ozone-platform=wayland
bind = $mainMod, F7, exec, google-chrome-stable
bind = $mainMod, F9, exec, firefox --new-window music.youtube.com

# Move focus with mainMod + arrow keys
bind = $mainMod, left, workspace, -1
bind = $mainMod, right, workspace, +1
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move focus with mainMod + hjkl
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Move window with mainMod + ctrl + hjkl
bind = $mainMod CTRL, h, movewindow, l
bind = $mainMod CTRL, l, movewindow, r
bind = $mainMod CTRL, k, movewindow, u
bind = $mainMod CTRL, j, movewindow, d

# Expand window with mainMod + shift + hjkl
bind = $mainMod SHIFT, h, resizeactive, -50 0
bind = $mainMod SHIFT, l, resizeactive, 50 0
bind = $mainMod SHIFT, k, resizeactive, 0 -50
bind = $mainMod SHIFT, j, resizeactive, 0 50
bind = $mainMod, tab, cyclenext,
bind = $mainMod SHIFT, tab, cyclenext, prev

# Switch workspaces with F1-F9
bind = , F1, workspace, 1
bind = , F2, workspace, 2
bind = , F3, workspace, 3
bind = , F4, workspace, 4
bind = , F5, workspace, 5
bind = , F6, workspace, 6
bind = , F7, workspace, 7
bind = , F8, workspace, 8
bind = , F9, workspace, 9

# Move active window to a workspace with SHIFT + F1-F9
bind = SHIFT, F1, movetoworkspacesilent, 1
bind = SHIFT, F2, movetoworkspacesilent, 2
bind = SHIFT, F3, movetoworkspacesilent, 3
bind = SHIFT, F4, movetoworkspacesilent, 4
bind = SHIFT, F5, movetoworkspacesilent, 5
bind = SHIFT, F6, movetoworkspacesilent, 6
bind = SHIFT, F7, movetoworkspacesilent, 7
bind = SHIFT, F8, movetoworkspacesilent, 8
bind = SHIFT, F9, movetoworkspacesilent, 9

# Example special workspace (scratchpad)
bind = $mainMod, grave, togglespecialworkspace, magic
bind = $mainMod SHIFT, grave, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = $mainMod, equal, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = $mainMod, minus, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = $mainMod, 0, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Lock screen
bind = $mainMod SHIFT, space, exec, hyprlock

# Screenshots (hyprshot)
bind = $mainMod, Print, exec, hyprshot -m window
bind = $mainMod SHIFT, Print, exec, hyprshot -m region

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# Sidebar
bind = $mainMod, s, exec, swaync-client -t -sw

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Example windowrules that are useful

windowrule {
    name = firefox-opacity
    match:class = firefox

    opacity = 1 override 1 override
}

windowrule {
    name = obsidian-opacity
    match:class = obsidian

    opacity = 1 override 1 override
}

windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}
env = WLR_NO_HARDWARE_CURSORS,1
