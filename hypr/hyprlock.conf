general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
    no_fade_in = false
    no_fade_out = false
    ignore_empty_input = true
}

# ─── BACKGROUND ─────────────────────────────────────────────────────────────

background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 8
    brightness = 0.6
    contrast = 0.9
    vibrancy = 0.2
    vibrancy_darkness = 0.5
}

# ─── DECORATIVE SHAPES ──────────────────────────────────────────────────────

# Outer glow ring behind the clock
shape {
    monitor =
    size = 520, 520
    color = rgba(33ccff08)
    rounding = -1
    border_size = 2
    border_color = rgba(33ccff33) rgba(00ff9933) 45deg
    position = 0, 60
    halign = center
    valign = center
    rotate = 0
}

# Inner card behind input
shape {
    monitor =
    size = 420, 180
    color = rgba(0d0d0d88)
    rounding = 16
    border_size = 1
    border_color = rgba(33ccff44) rgba(00ff9944) 45deg
    position = 0, -160
    halign = center
    valign = center
}

# ─── TIME ───────────────────────────────────────────────────────────────────

label {
    monitor =
    text = $TIME
    color = rgba(eeffffff)
    font_size = 90
    font_family = MesloLGS Nerd Font
    position = 0, 100
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(33ccff55)
    shadow_boost = 1.2
}

# ─── DATE ───────────────────────────────────────────────────────────────────

label {
    monitor =
    text = cmd[update:60000] date '+%A, %B %d'
    color = rgba(33ccffcc)
    font_size = 20
    font_family = MesloLGS Nerd Font
    position = 0, 20
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(00000088)
}

# ─── INPUT FIELD ────────────────────────────────────────────────────────────

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.18
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(33ccff99) rgba(00ff9999) 45deg
    inner_color = rgba(0d0d0dcc)
    font_color = rgba(eeffffff)
    fade_on_empty = true
    fade_timeout = 2000
    placeholder_text = <span foreground="##33ccff">  Enter Password</span>
    hide_input = false
    rounding = 12
    check_color = rgba(00ff99ff)
    fail_color = rgba(ff4466ff)
    fail_text = <i>  Wrong password</i>
    fail_transition = 300
    capslock_color = rgba(ffcc00ff)
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = false
    position = 0, -185
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 6
    shadow_color = rgba(33ccff33)
}

# ─── STATUS / HINTS ─────────────────────────────────────────────────────────

label {
    monitor =
    text = cmd[update:1000] echo " $(date +%H:%M) |  $(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -1)% | $(pactl get-sink-volume @DEFAULT_SINK@ 2>/dev/null | grep -oP '\d+(?=%)' | head -1)%"
    color = rgba(ffffff55)
    font_size = 12
    font_family = MesloLGS Nerd Font
    position = 0, 30
    halign = center
    valign = bottom
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(00000088)
}
