# GENERAL
general {
    no_fade_in = true
    no_fade_out = true
    hide_cursor = false
    grace = 0
    disable_loading_bar = true
    ignore_empty_input = true
}

# ─── BACKGROUND ─────────────────────────────────────────────────────────────

background {
    monitor =
    path = screenshot
    blur_passes = 2
    blur_size = 8
    contrast = 1
    brightness = 0.5
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}

# ─── INPUT FIELD ────────────────────────────────────────────────────────────

input-field {
    monitor =
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(0, 0, 0, 0.2)
    font_color = rgba(238, 255, 255, 1)
    fade_on_empty = false
    rounding = -1
    check_color = rgb(204, 136, 34)
    fail_color = rgba(ff4466ff)
    fail_text = <i>  Wrong password</i>
    placeholder_text = <i><span foreground="##cdd6f4">Input Password...</span></i>
    hide_input = false
    position = 0, -200
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 6
    shadow_color = rgba(00000088)
}

# ─── DATE ───────────────────────────────────────────────────────────────────

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = rgba(242, 243, 244, 0.75)
    font_size = 22
    font_family = JetBrains Mono
    position = 0, 300
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(00000088)
}

# ─── TIME ───────────────────────────────────────────────────────────────────

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%-I:%M")"
    color = rgba(242, 243, 244, 0.75)
    font_size = 95
    font_family = JetBrains Mono Extrabold
    position = 0, 200
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(00000088)
}

# ─── PROFILE PICTURE ────────────────────────────────────────────────────────

image {
    monitor =
    path = /home/namit/Pictures/profile_pictures/namit_square.png
    size = 100
    border_size = 2
    border_color = rgba(238, 255, 255, 0.8)
    position = 0, -100
    halign = center
    valign = center
}

# ─── HYPRLAND LOGO ──────────────────────────────────────────────────────────

image {
    monitor =
    path = /home/namit/Pictures/profile_pictures/hypr.png
    size = 75
    border_size = 2
    border_color = rgba(238, 255, 255, 0.8)
    position = -50, 50
    halign = right
    valign = bottom
}

# ─── CURRENT SONG ───────────────────────────────────────────────────────────

label {
    monitor =
    text = cmd[update:1000] echo "$(playerctl metadata --format '{{ artist }} - {{ title }}' 2>/dev/null || echo '')"
    color = rgba(242, 243, 244, 0.75)
    font_size = 18
    font_family = JetBrains Mono, Font Awesome 6 Free Solid
    position = 0, 50
    halign = center
    valign = bottom
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(00000088)
}

# ─── USERNAME ───────────────────────────────────────────────────────────────

label {
    monitor =
    text = cmd[update:60000] echo "$(whoami)"
    color = rgba(242, 243, 244, 0.75)
    font_size = 14
    font_family = JetBrains Mono
    position = 0, -10
    halign = center
    valign = top
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(00000088)
}

# ─── BATTERY ────────────────────────────────────────────────────────────────

label {
    monitor =
    text = cmd[update:30000] echo " $(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -1)%"
    color = rgba(242, 243, 244, 0.75)
    font_size = 18
    font_family = JetBrains Mono, Font Awesome 6 Free Solid
    position = -90, -10
    halign = right
    valign = top
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(00000088)
}

# ─── NETWORK ────────────────────────────────────────────────────────────────

label {
    monitor =
    text = cmd[update:5000] echo "$(nmcli -t -f active,ssid dev wifi 2>/dev/null | grep '^yes' | cut -d: -f2 | head -1 || echo '睊 offline')"
    color = rgba(242, 243, 244, 0.75)
    font_size = 18
    font_family = JetBrains Mono, Font Awesome 6 Free Solid
    position = -20, -10
    halign = right
    valign = top
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(00000088)
}
